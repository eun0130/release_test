name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject version from tag into manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' manifest.json > manifest.tmp
          mv manifest.tmp manifest.json
          echo "Building version $VERSION"
          cat manifest.json

      - name: Build zip
        run: zip -r atlasWbs-${GITHUB_REF_NAME}.zip manifest.json app.js popup.html popup.js config.default.json update.ps1 update.vbs README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: atlasWbs-*.zip
          generate_release_notes: true
